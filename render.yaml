# Render Blueprint — Dashboard → New → Blueprint → pick this repo.
# NOTE: persistent disks require a paid instance (starter). On plan: free,
# delete the `disk:` block and DATABASE_URL — SQLite then lives on ephemeral
# storage and resets on every deploy/spin-down (OK for a quick demo only).
services:
  - type: web
    name: commitpay
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: commitpay-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        value: file:/data/commitpay.db
      - key: PAYPAL_MODE
        value: sandbox
      - key: FEATURE_ANTI_CHEAT
        value: "1"
      - key: FEATURE_ESCAPE_HATCH
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false   # https://<service>.onrender.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false   # fill after first deploy, then restart
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
